services:
  tg_proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_file_proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:${HTTP_PORT:-8080}"
    env_file:
      - .env
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - TEMP_DIR=${TEMP_DIR:-/tmp/tg_file_proxy}
    volumes:
      - ./data:/app/data
      - tg_chunk_cache:/tmp/tg_file_proxy
    # Strict resource isolation: 300MB RAM limit
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.85"
        reservations:
          memory: 40M

volumes:
  tg_chunk_cache:
